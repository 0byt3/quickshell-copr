name: Fedora 44 release gate

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Stable upstream tag (empty means latest)
        type: string
        required: false
      force:
        description: Rebuild the same release after Fedora/Qt updates
        type: boolean
        default: false
  repository_dispatch:
    types:
      - quickshell-release
  pull_request:
    paths:
      - "qscopr/**"
      - "config.toml"
      - "packaging/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: quickshell-release-${{ github.event_name == 'pull_request' && github.event.number || 'updates' }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python3 -m unittest discover -s tests -v
      - name: Check dependencies and build RPM
        id: check
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          FORCE_REBUILD: ${{ inputs.force }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          args=(check --output artifacts/check)
          if [[ -n "$RELEASE_TAG" ]]; then
            args+=(--tag "$RELEASE_TAG")
          fi
          if [[ "$FORCE_REBUILD" == "true" || "$IS_PR" == "true" ]]; then
            args+=(--force)
          fi
          if [[ "$IS_PR" != "true" ]]; then
            args+=(--promote)
          fi
          rc=0
          python3 -m qscopr "${args[@]}" || rc=$?
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("artifacts/check/gate.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"status={report['status']}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(f"## Fedora 44: {report['status']}\n")
              output.write(report.get("message", "") + "\n")
              for capability in report.get("missing", []):
                  output.write(f"- Missing: `{capability}`\n")
          PY
          if [[ "$rc" == "1" || ( "$IS_PR" == "true" && "$rc" != "0" ) ]]; then
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fedora44-release-report
          path: artifacts/check/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.check.outputs.status == 'validated' && github.event_name != 'pull_request'
        with:
          name: validated-packaging
          path: packaging/
          retention-days: 14

  propose:
    needs: gate
    if: >-
      needs.gate.outputs.status == 'validated' &&
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-packaging
          path: packaging/
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/quickshell-release
          add-paths: |
            packaging/quickshell.spec
            packaging/cpptrace.spec
            packaging/validated.json
            packaging/dependencies.json
          commit-message: |
            Update validated Quickshell Fedora 44 packaging

            Co-Authored-By: Warp <agent@warp.dev>
          title: Update validated Quickshell Fedora 44 packaging
          body: |
            cpptrace was built and validated first; the selected stable Quickshell
            release then passed its offline, unprivileged RPM build. All other
            dependencies came from official Fedora 44 repositories.
            See the workflow artifacts for logs and RPMs.
            COPR publication is separate and opt-in.

            Co-Authored-By: Warp <agent@warp.dev>
