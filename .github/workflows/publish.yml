name: Publish validated RPM to COPR

on:
  push:
    paths:
      - "packaging/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickshell-copr-publication
  cancel-in-progress: false

jobs:
  revalidate:
    if: >-
      vars.ENABLE_COPR_PUBLISH == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python3 -m qscopr check --verify-tracked --output artifacts/publish
      - run: python3 -m qscopr publication --output artifacts/publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: copr-revalidation-report
          path: artifacts/publish/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-publication
          path: |
            artifacts/publish/*.src.rpm
            artifacts/publish/publication.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: revalidate
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 150
    environment: copr
    steps:
      - name: Install publisher from Fedora repositories
        run: dnf --repo=fedora --repo=updates install -y git python3 python3-copr
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-publication
          path: artifacts/publish/
      - name: Publish cpptrace, then Quickshell, and wait for COPR
        env:
          ENABLE_COPR_PUBLISH: "true"
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: python3 -m qscopr.publish --output artifacts/publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: copr-publication-result
          path: |
            artifacts/publish/copr-result.json
            artifacts/publish/cpptrace-copr-result.json
